<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Varotas — Our new site is coming soon. Stay tuned!">
    <title>Varotas</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===================== VIDEO BACKGROUND ===================== -->
    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto" id="bg-video">
            <source src="assets/bg-video.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- ===================== PINNED LOGO (Top Left) ===================== -->
    <a href="#" id="logo-link" class="pinned-logo" aria-label="Varotas Home">
        <div class="logo-icon">
            <svg preserveAspectRatio="xMidYMid meet" data-bbox="0 0 200 200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true">
                <g><path d="M196,52V4H4v192h192v-48h4v52H0V0h200v52H196z" fill="#FFFFFF"></path></g>
            </svg>
        </div>
        <span class="logo-text">Varotas</span>
    </a>

    <!-- ===================== HERO SECTION ===================== -->
    <section class="hero" id="hero">
        <!-- Decorative Sun/Compass SVG -->
        <div class="hero-compass animate-target">
            <svg preserveAspectRatio="xMidYMid meet" viewBox="3.5 3.5 193 193" height="200" width="200" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true">
                <g>
                    <path fill="#FFFFFF" d="M100.267 3.5v16.632h-.533V3.5h.533z"/>
                    <path fill="#FFFFFF" d="M100.267 179.868V196.5h-.533v-16.632h.533z"/>
                    <path fill="#FFFFFF" d="M196.5 99.734v.533h-16.632v-.533H196.5z"/>
                    <path fill="#FFFFFF" d="M20.132 99.734v.533H3.5v-.533h16.632z"/>
                    <path fill="#FFFFFF" d="M183.533 51.68l.265.462-14.42 8.288-.265-.462 14.42-8.288z"/>
                    <path fill="#FFFFFF" d="M30.622 139.565l.265.462-14.42 8.288-.265-.463 14.42-8.287z"/>
                    <path fill="#FFFFFF" d="M147.819 16.183l.462.265L140 30.872l-.463-.266 8.282-14.423z"/>
                    <path fill="#FFFFFF" d="M59.997 169.131l.463.266-8.282 14.423-.462-.265 8.281-14.424z"/>
                    <path fill="#FFFFFF" d="M51.896 16.342l8.331 14.395-.461.267-8.331-14.395.461-.267z"/>
                    <path fill="#FFFFFF" d="M140.236 168.986l8.33 14.395-.46.267-8.332-14.395.462-.267z"/>
                    <path fill="#FFFFFF" d="M16.39 51.817l14.433 8.264-.265.463-14.433-8.265.265-.462z"/>
                    <path fill="#FFFFFF" d="M169.44 139.454l14.433 8.264-.264.463-14.434-8.265.265-.462z"/>
                </g>
            </svg>
        </div>

        <!-- Animated GIF Logo -->
        <div class="hero-gif animate-target">
            <img src="assets/logo-animated.gif" alt="Varotas animated logo" width="527" height="527">
        </div>

        <!-- Hero Text -->
        <p class="hero-subtitle animate-target">OUR NEW SITE IS</p>
        <h1 class="hero-title animate-target">COMING<br>SOON</h1>
        <p class="hero-subtitle animate-target">STAY TUNED!</p>
    </section>

    <!-- ===================== SUBSCRIBE SECTION ===================== -->
    <section class="subscribe-section" id="subscribe">
        <!-- Down Arrow Button -->
        <a href="#subscribe" class="scroll-down-btn animate-target" aria-label="Scroll to subscribe section">
            <img src="assets/arrow-down.png" alt="Scroll down" width="50" height="50">
        </a>

        <!-- Subscribe Form -->
        <div class="subscribe-form-wrapper animate-target">
            <p class="subscribe-text">Subscribe to be the first to know about our launch</p>
            <form id="subscribe-form" class="subscribe-form">
                <div class="form-group">
                    <input type="email" id="email-input" name="email" placeholder="Enter your email here*" required pattern="^.+@.+\.[a-zA-Z]{2,63}$" maxlength="250" autocomplete="off">
                </div>
                <button type="submit" id="subscribe-btn" class="subscribe-btn">Subscribe Now</button>
            </form>
            <p class="success-message" id="success-msg">Thanks for submitting!</p>
        </div>
    </section>

    <!-- ===================== FOOTER ===================== -->
    <footer class="site-footer">
        <p class="copyright">&copy; 2026 by Varotas</p>
        <a href="#hero" class="scroll-top-btn" aria-label="Back to top">
            <img src="assets/arrow-up.png" alt="Back to top" width="50" height="50">
        </a>
    </footer>

    <!-- ===================== SCRIPTS ===================== -->
    <script>
        // Scroll-triggered fade-in animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-in');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.animate-target').forEach(el => observer.observe(el));

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Subscribe form
        document.getElementById('subscribe-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('Please enter a valid email');
                return;
            }
            document.getElementById('success-msg').classList.add('visible');
            document.getElementById('email-input').value = '';
            // Hide success message after 5 seconds
            setTimeout(() => {
                document.getElementById('success-msg').classList.remove('visible');
            }, 5000);
        });

        // Ensure video plays (some browsers block autoplay)
        const video = document.getElementById('bg-video');
        video.play().catch(() => {});
    </script>
</body>
</html>
