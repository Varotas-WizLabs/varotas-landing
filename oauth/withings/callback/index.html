<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting Withings…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1115; color: #e6e6e6; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  a { color: #7cc4ff; }
</style>
</head>
<body>
<main>
  <h1 id="title">Connecting Withings…</h1>
  <p id="msg">Handing the authorisation back to the backup app running on this computer.</p>
  <p id="fallback" hidden>If nothing happens, make sure the app is running and <a id="link" href="#">open this link</a>.</p>
</main>
<script>
  // Withings requires an https callback and the code expires after 30 seconds, so this
  // page forwards the browser to the backup app on localhost immediately. The target is
  // fixed; the query string (code, state, error) is passed through unchanged.
  (function () {
    var target = "http://localhost:8767/oauth/withings/callback" + window.location.search;
    var params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      document.getElementById("title").textContent = "Withings did not authorise the app";
      document.getElementById("msg").textContent = params.get("error_description") || params.get("error");
    }
    document.getElementById("link").href = target;
    setTimeout(function () { document.getElementById("fallback").hidden = false; }, 2500);
    if (params.get("code") || params.get("error")) { window.location.replace(target); }
    else { document.getElementById("msg").textContent = "This page is only used by Withings' sign-in flow."; }
  })();
</script>
</body>
</html>
